# Sumber aktif — dibaca collector (jangan hardcode di logic).
# Instagram & Threads via SocialCrawl API (key di .env: SOCIALCRAWL_API_KEY).
# source_type:
#   account  = posting terbaru hari ini dari akun publik
#   tag      = posting Threads yang topic_tag-nya persis tag ini (1–2 credit/tag).
#              SocialCrawl tidak punya feed tag: threads/search query=<tag> lalu
#              disaring klien di _fetch_threads_tag (ext.topic_tag == tag).
# Threads TIDAK pakai keyword search lagi: noise jual-beli, dan tidak membedakan
# warga yang benar-benar memakai tag dari sekadar menyebut kata.
#
# INSTAGRAM HASHTAG DIHAPUS (6 Okt 2026): feed #malang 5 credit/halaman dan isinya
# didominasi unggahan=jual-beli/fashion, bukan isu publik. Sumber IG sekarang hanya
# 3 akun berita resmi + komentar teratas posting yang relevan (lihat pipeline).
sources:
  - platform: instagram
    source_type: account
    source_value: malangraya_info
    active: true
  - platform: instagram
    source_type: account
    source_value: infomalangan
    active: true
  - platform: instagram
    source_type: account
    source_value: jawaposradarmalang
    active: true
  # Threads: posting hari ini dari akun berita + balasan warga (utas)
  - platform: threads
    source_type: account
    source_value: malangraya_info
    replies: true
    active: true
  - platform: threads
    source_type: account
    source_value: infomalangan
    replies: true
    active: true
  - platform: threads
    source_type: account
    source_value: jawaposradarmalang
    replies: true
    active: true
  - platform: threads
    source_type: account
    source_value: malangposcomedia
    replies: true
    active: true
  - platform: threads
    source_type: account
    source_value: infomalangraya
    replies: true
    active: true

  # Threads: posting ber-topic_tag (saringan ext.topic_tag di sisi klien)
  # Hanya tag yang benar-benar dipakai warga: "malang" (3–5 posting/hari) dan
  # "karangploso malang" (kecamatan). Tag lain (beritamalang/malangraya/
  # infomalang) selalu 0 hasil dalam 2 hari probe, jadi dibuang demi credit.
  - platform: threads
    source_type: tag
    source_value: malang
    active: true
  - platform: threads
    source_type: tag
    source_value: karangploso malang
    active: true